spring:
  application:
    name: priorauth-service

  # In-memory H2 database. Everything resets when the app stops.
  datasource:
    url: jdbc:h2:mem:priorauth;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # Create the schema from our @Entity classes on startup.
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Browse the database at http://localhost:8080/h2-console
  # (JDBC URL: jdbc:h2:mem:priorauth  user: sa  no password)
  h2:
    console:
      enabled: true

server:
  port: 8080
